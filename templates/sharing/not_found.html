{% extends "base.html" %}

{% block title %}Enlace No Encontrado — SignBox{% endblock %}

{% block public_content %}
<div class="row justify-content-center min-vh-75 align-items-center mt-5">
  <div class="col-md-6 col-lg-5 text-center">
    <div class="card p-5 border-0 shadow-sm">
      <i class="bi bi-question-circle text-muted fs-1 mb-3"></i>
      <h4 class="fw-bold text-dark mb-2">Enlace de Verificación No Encontrado</h4>
      <p class="text-muted small mb-4">El identificador proporcionado no corresponde a ningún documento registrado o ha sido retirado.</p>
      <div>
        <a href="{% url 'verification:compare' %}" class="btn btn-outline-primary btn-sm">
          <i class="bi bi-patch-check me-1"></i> Verificar subiendo un archivo PDF
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
