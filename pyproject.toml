[project]
name = "signbox"
version = "0.1.0"
description = "SaaS multiusuario para firma digital, gestión documental y seguimiento de PDF."
authors = [{ name = "SignBox Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.1",
    "pyhanko>=0.38.0",
    "pyhanko-certvalidator>=0.33.0",
    "cryptography>=43.0.0",
    "pypdf>=5.0.0",
    "reportlab>=4.2.0",
    "qrcode[pil]>=8.0",
    "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps", "tests"]
